<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Between The Buns — a short-order diner rush</title>
<style>
  /* Warm diner palette: dark walnut around the 1280x720 kitchen, cream text. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e120d; color: #fff6e6; }
  body { font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Between The Buns: walk the diner kitchen, grill patties, chop vegetables, stack burgers to the ticket and serve them at the pass"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
